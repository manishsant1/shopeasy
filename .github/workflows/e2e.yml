name: E2E tests

on:
  push:
    branches: [main]
  pull_request:

# One run at a time: all runs share the same test database and reset it.
concurrency:
  group: e2e-test-database
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Repository secret holding the Neon TEST database URL (never the dev/prod one).
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      PORT: '3100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
